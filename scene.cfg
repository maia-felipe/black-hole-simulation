# Scene description for the Schwarzschild black hole renderer.
#
#   ./build/raytracer              uses this file
#   ./build/raytracer other.cfg    uses another one
#
# Lengths are in units of M (G = c = M = 1): the horizon is at r = 2, the photon
# sphere at r = 3, the ISCO at r = 6. Anything omitted falls back to the defaults
# in include/config.h.

# --- image ---
width            = 800
height           = 450
samples_per_axis = 3      # rays per pixel per axis; 1 to iterate fast, 3 to ship
threads          = 0      # 0 = one per hardware thread
output           = output.png

# --- accretion disk ---
disk_r_inner = 6.0        # the Page-Thorne flux profile assumes this is the ISCO
disk_r_outer = 36.0
disk_t_peak  = 10500.0    # kelvin at the flux maximum, near r = 9.55

# --- camera ---
camera_distance  = 100.0
camera_elevation = 6.0    # degrees above the disk plane; small = nearly edge-on
camera_fov       = 24.0   # vertical field of view, degrees

# --- background ---
sky_texture = assets/eso0932a.jpg   # missing file => procedural starfield
sky_tilt    = 13.0                  # rotates the galactic plane off the disk plane
sky_roll    = 45.0
sky_gain    = 1.0

# --- tone mapping ---
exposure_percentile = 0.995   # this quantile of frame luminance maps to the target
exposure_target     = 0.9

# --- integration accuracy ---
# Lower d_phi costs time and buys sky-direction accuracy (see Phase 6 in CLAUDE.md).
# phi_max is in units of pi: the spiral cutoff for photons trapped near the ring.
trace_d_phi   = 0.01
trace_phi_max = 40.0
